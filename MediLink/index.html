<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediLink – Medical Shop Management System</title>
    <meta name="description" content="MediLink – multi-branch pharmacy and medical shop management system." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="google_translate_element" style="display:none"></div>
    <div id="root"></div>
    <script type="text/javascript">
      window.googleTranslateElementInit = function() {
        try {
          if (window.google && window.google.translate) {
            new window.google.translate.TranslateElement({
              pageLanguage: 'en',
              includedLanguages: 'en,ta,hi,te,ml,kn,es,fr,de,ar',
              autoDisplay: false
            }, 'google_translate_element');
          }
        } catch (e) {
          console.warn('Google Translate Init Note:', e);
        }
      };
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
